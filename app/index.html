<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OK.ru Cine Clásico</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="netflix-body">
  <!-- Barra lateral vertical izquierda estilo Netflix TV -->
  <aside class="netflix-sidebar" id="netflix-sidebar">
    <div class="sidebar-logo">
      <span class="logo-n">N</span>
      <span class="logo-text">CINE</span>
    </div>

    <nav class="sidebar-nav">
      <button class="focusable sidebar-btn" id="nav-search" title="Buscar" tabindex="0">
        <svg class="sidebar-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <span class="sidebar-label">Buscar</span>
      </button>

      <button class="focusable sidebar-btn active" id="nav-home" title="Inicio" tabindex="0">
        <svg class="sidebar-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span class="sidebar-label">Inicio</span>
      </button>

      <button class="focusable sidebar-btn" id="nav-categories" title="Categorías" tabindex="0">
        <svg class="sidebar-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
        <span class="sidebar-label">Épocas</span>
      </button>

      <button class="focusable sidebar-btn" id="nav-favorites" title="Mi Lista" tabindex="0">
        <svg class="sidebar-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span class="sidebar-label">Mi Lista (<span id="fav-counter">0</span>)</span>
      </button>

      <button class="focusable sidebar-btn" id="nav-settings" title="Ajustes" tabindex="0">
        <svg class="sidebar-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        <span class="sidebar-label">Ajustes</span>
      </button>
    </nav>
  </aside>

  <!-- Contenedor Principal (Con scroll vertical suave) -->
  <main class="netflix-main" id="netflix-main">
    
    <!-- Hero Billboard Superior estilo Netflix -->
    <section class="hero-billboard" id="hero-billboard">
      <div class="billboard-backdrop" id="billboard-backdrop"></div>
      <div class="billboard-vignette-bottom"></div>
      <div class="billboard-vignette-left"></div>

      <div class="billboard-content">
        <div class="billboard-badge">
          <span class="badge-series">🎬 CINE CLÁSICO</span>
        </div>
        <h1 class="billboard-title" id="billboard-title">Metrópolis</h1>
        
        <div class="billboard-meta">
          <span class="meta-match" id="billboard-match">98% para ti</span>
          <span class="meta-year" id="billboard-year">1927</span>
          <span class="meta-rating" id="billboard-rating">⭐ 8.2</span>
          <span class="meta-quality">FULL HD</span>
          <span class="meta-badge">OK.ru</span>
        </div>

        <p class="billboard-overview" id="billboard-overview">
          En una megalópolis del año 2026, la sociedad se divide en pensadores y trabajadores.
        </p>

        <div class="billboard-actions">
          <button id="btn-billboard-play" class="focusable btn-play" tabindex="0">
            <span class="play-icon">▶</span> Reproducir
          </button>
          <button id="btn-billboard-fav" class="focusable btn-fav-hero" tabindex="0">
            <span class="hero-fav-icon">🤍</span> Mi Lista
          </button>
        </div>
      </div>
    </section>

    <!-- Carruseles horizontales organizados por categorías / décadas -->
    <section class="rows-wrapper" id="rows-wrapper">
      <!-- Los carruseles se generan dinámicamente con app.js -->
    </section>

    <!-- Vista de Búsqueda OK.ru (Se activa al buscar) -->
    <section class="search-view hidden" id="search-view">
      <div class="search-header">
        <div class="search-box">
          <svg class="search-box-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input 
            type="text" 
            id="search-input" 
            class="focusable search-input" 
            placeholder="Buscar títulos, películas clásicas en OK.ru..." 
            tabindex="0"
          />
          <button id="search-btn" class="focusable btn-do-search" tabindex="0">Buscar</button>
          <button id="search-close-btn" class="focusable btn-close-search" tabindex="0">✖ Volver</button>
        </div>
        <div class="search-info">
          <h2 class="search-title" id="search-title">Resultados de búsqueda</h2>
          <span class="search-count" id="search-count"></span>
        </div>
      </div>

      <div class="search-grid" id="search-grid">
        <!-- Tarjetas de resultados de búsqueda -->
      </div>
    </section>

    <!-- Indicador de Carga / Mensajes -->
    <div id="status-container" class="status-message hidden">
      <div id="status-spinner" class="spinner hidden"></div>
      <div id="status-text"></div>
    </div>
  </main>

  <!-- Notificación Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Modal / Reproductor a pantalla completa -->
  <div id="player-modal" class="player-modal hidden">
    <div class="player-wrapper">
      <iframe 
        id="okru-iframe" 
        class="video-frame" 
        src="" 
        frameborder="0" 
        tabindex="-1"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>
    <div id="player-header" class="player-header">
      <button id="btn-back" class="focusable btn-back" tabindex="0">⬅ Volver (Atrás)</button>
      <h2 id="player-title" class="player-title">Título de la película</h2>
      <button id="btn-player-fav" class="focusable btn-player-fav" tabindex="0">🤍 Favorito</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
